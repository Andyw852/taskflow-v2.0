# cohp-cogito 技能参数（stepconf.py 三层合并：
#   skill 出厂默认 < 项目 templates/step.conf < 项目 templates/<步骤名>/step.conf）
#
# 覆盖方式：
#   tf -tt cohp-cogito -p <材料> conf --set params.NUM_OUTER=6
[params]
# COGITO 轨道优化外循环。默认 4；COGITOanalyze 报
# "orbital radius change over 1%" 时建议 +1 或 +2 后重跑 S1。
NUM_OUTER = 4

# COHP 生成器参数（传给 COGITOpost；留空用 COGITO 默认）
# DENSIFY 越大曲线越平滑（1 = 默认，2/3 更平滑但更慢）
DENSIFY =

# 运行 COGITO 的 conda 环境（jzzn 上已装 cogito-dft 0.3.13）
CONDA_SH = ~/miniconda3/etc/profile.d/conda.sh
CONDA_ENV = atomate2_p_a
