# =====================================================================
# unihamgnn 全局 step.conf —— HamGNN/OpenMX 安装、通用模型、计算参数。
# 当前默认按 3090 服务器（wangchaoyue852）部署固化；换机器时用
#   tf -tt unihamgnn -p <材料> -j <步骤> conf --set params.XXX=...
# 覆盖，或在项目 project_setting/templates/step.conf 里写新的默认值。
# 看生效值：tf -tt unihamgnn -p <材料> -j <步骤> conf
# =====================================================================
[params]
# --- 环境（3090；CONDA_ENV 是 conda 环境名，含 / 按 venv 激活）--------
CONDA_SH  = /home/wangchaoyue852/miniconda3/etc/profile.d/conda.sh
CONDA_ENV = ML

# --- HamGNN / OpenMX 安装（3090 部署位置）------------------------------
HAMGNN_DIR = /home/wangchaoyue852/software/Uni-HamGNN/HamGNN
UNI_MODEL  = /home/wangchaoyue852/software/Uni-HamGNN/uni-hamgnn_2_1.pkl
# openmx_postprocess / read_openmx（留空 = 自动取 HAMGNN_DIR 下默认位置）
OPENMX_POSTPROCESS =
READ_OPENMX =
# OpenMX 赝势/基组目录 DFT_DATA19（取自 OpenMX 4.0 GPU 包）
DFT_DATA = /home/wangchaoyue852/software/Uni-HamGNN/DFT_DATA19

# --- 维度 ----------------------------------------------------------------
DIMENSION = auto        # auto | 2d | 3d

# --- 计算 ----------------------------------------------------------------
SOC       = true        # 通用 SOC 模型：true = 生成 non-SOC + SOC 两份 graph_data
NAO_MAX   = 26          # OpenMX 最大轨道数：14 / 19 / 26
# ★ 3090 上用 NPROC=1：多进程时 openmx_postprocess 卡在 MPI 收尾不退出。
#   单进程干净利落（6 原子胞约 42s），驱动里另有「硬超时 + 认 Finish 标记」兜底。
NPROC     = 1
# mpirun 完整路径（3090 的 openmx_build conda 环境里，ML 环境没有 MPI）
MPIRUN    = /home/wangchaoyue852/miniconda3/envs/openmx_build/bin/mpirun
NTHREADS  = 16          # predict 的 OMP 线程数
DEVICE    = cpu         # predict 设备 cpu|cuda（3090 纯 CPU 跑）
NK        = 120         # band_cal 能带路径 k 点数

# --- OpenMX SCF 参数（写进 poscar2openmx 的 basic_command）----------------
XC               = GGA-PBE
ENERGY_CUTOFF    = 200.0      # Ry
KGRID            = 5 5 5
ELECTRONIC_TEMP  = 300.0      # K
SCF_CRITERION    = 1.0e-7     # Hartree
MAX_SCF_ITER     = 300
