[params]
FUNC        = pbesol
SUPERCELL   =            # 显式 "3 3 3"；空=按 MIN_SC_LEN 自动。2D 真空方向压 1
MIN_SC_LEN  = 12.0       # 超胞每个非真空方向最小胞长(Å)
MAX_MULTIPLE= 6
FD_DISTANCE = 0.01       # phonopy 2 阶有限位移幅度(Å)
PHONON_MESH = 20 20 20   # q 网格（写进 kl_params 供 step3；2D 自动 kz=1）
KSPACING    = 0.03       # 超胞取力 K 点间距
MAX_DISP    = 200        # 位移帧数硬闸
