# =====================================================================
# step.conf -- fc-fit global layer (force-constant fitting, fc2 / fc3)
#
# This is the factory default GLOBAL layer, merged into every step of the
# skill.  It deliberately holds no keys: every tuning knob of this skill
# belongs to one specific step, and putting a key here would leak it into the
# other steps (stepconf rejects keys a step's gen does not declare).
#   templates/step1_fit/step.conf      fitting engine, cutoffs, gate
#
# Three-layer merge, later wins:
#   skill/fc-fit/templates/step.conf                          factory default
#   <material>/fc-fit/project_setting/templates/step.conf     per material
#   .../project_setting/templates/<step name>/step.conf       per step
#
# Inspect effective values and their origin:
#     tf -tt fc-fit -p <material> -j step1_fit conf
# Change one value:
#     tf -tt fc-fit -p <material> -j step1_fit conf --set params.FIT_ENGINE=hiphive
# =====================================================================

