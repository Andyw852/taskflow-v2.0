# =====================================================================
# mlff-mace 全局 step.conf —— 所有步骤共用（三层合并，越靠后越优先）：
#   skill/mlff-mace/templates/step.conf                            出厂默认
#   <材料>/mlff-mace/project_setting/templates/step.conf           本材料共用
#   <材料>/mlff-mace/project_setting/templates/<步骤名>/step.conf  只管该步骤
# 看生效值：  tf -tt mlff-mace -p <材料> -j <步骤> conf
# 改：        tf -tt mlff-mace -p <材料> -j <步骤> conf --set params.KEY=值
# =====================================================================

[params]
# --- 体系与维度 ---
FUNC             = pbesol          # pbe | pbesol | pbe-d3（step1 与 step5 必须一致）
DIMENSION        = auto            # auto | 2d | 3d
ENCUT_OVERRIDE   =                 # 空 = ceil(1.5 × max ENMAX)
CELL_POLICY      = primitive       # step1 取原胞（超胞/声子都在原胞上展开）
VACUUM_AXIS_POLICY = error         # 2D 真空不在 c 轴时报错（不会静默转走）

# --- DFT+U（沿用 relax_common 阴离子门控；U_OVERRIDE 生效时必须全构型一致）---
AUTO_U           = auto            # auto | true | false
U_OVERRIDE       =                 # 如  Mn:3.9 Fe:0
U_ANION_GATE     = true
U_GATE_ANIONS    = O F

# --- 数据模式 ---
DATA_MODE        = scratch         # scratch | extend
PRE_XYZ_FILES    =                 # extend 用，逗号分隔（绝对/相对路径）
REF_FC2_PATH     =                 # 有则跳过 DFT 声子基准（displ 帧不生成）

# --- 结构生成 ---
VOL_FACTORS      = 0.94,0.96,0.98,1.00,1.02,1.04,1.06 # 7 档 ±6%：B0 是 required 闸，3 点(E0/B0/V0)
#                                     零自由度、能量误差 1:1 进 B0（GaAs ±3% 信号 ~3.9 meV 占能量
#                                     RMSE 38%，B0 实测 -41%）。7 点多 4 个 static 帧成本 ~10%，
#                                     B0 有 4 自由度可平均（Si 实测 3 点拟合本身无偏但无抗噪）。
RATTLE_STD       = auto            # auto = step3 自校准 [0.5,1.0,1.6]×u_rms(300K)
RATTLE_STD_FALLBACK = 0.03,0.06,0.10
N_PER_CELL       = 2               # 每个（应变, 幅度）格点的种子数
MIN_DIST_RATIO   = 0.75            # d_min = 比例 × (两原子共价半径之和)
REF_DISP         = 0.1             # Å，=autoplex 默认（0.01 的位移力会被 rattle 帧在损失里淹没，谐波刚度学不到）
DISP_WARN        = 80
ISO_BOX          = 15.0            # 孤立原子盒子边长（Å）
GRUNEISEN_STRAIN = 0.01            # Grüneisen 用 ±1% 晶格应变
SEED_BASE        = 2025

# --- 超胞 ---
MIN_ATOMS        = 60
MAX_ATOMS        = 150
MIN_VACUUM       = 15.0            # 2D 真空厚度下限

# --- 迭代与停机（★ 控制核心，见 README §7）---
GENERATION       = 0
MAX_GENERATION   = 4
RMS_MAX          = 0.2             # THz，主收敛闸
IMPROVE_MIN      = 0.02            # THz，判定「本代是否有实质改善」
GEN_INCREMENT    = 20              # 每代新增 rattle 帧数
CURVE_POINTS     = 25,50,100,200,all
CURVE_TOL        = 0.05            # 学习曲线判平阈值（相对改善）
FORCE_CONTINUE   = false           # 停机后强制继续（默认禁止）

# --- 数据处理 ---
ENERGY_LIMIT     = 0.005           # eV/atom，离群过滤（>10% WARN，>30% FAIL）
FORCE_LIMIT      = 40.0            # eV/Å，力分量上限（=autoplex force_max 默认，源码为准）
KSPACING_TOL     = 0.20            # 指纹 k 点密度容差

# --- 微调（§10）---
MACE_MODEL       = MACE-matpes-pbe-omat-ft.model   # 与 kl-mace-* / phonon-mace-cpu 对齐（原 2023-12-03-mace-128-L1_epoch-199.model）
REPLAY_XYZ       =                 # 多头微调 replay，必需（集群无外网）
E0S_MODE         = estimated        # estimated | json（基座与 DFT 零点差大，用 estimated 对齐）
N_COMMITTEE      = 4               # seed 固定 1,2,3,4
ENERGY_WEIGHT    = auto            # 3D→1.0，2D→10.0
FORCES_WEIGHT    = 100.0
STRESS_WEIGHT    = auto            # 3D→10.0，2D→0（面外应力是垃圾不能训）
BATCH_SIZE       = 10              # autoplex MACE 默认；GPU OOM 自动降 1
DTYPE            = float64         # ★ 不许改（float32 力误差会造出假虚频）
LR               = 0.001           # autoplex MACE 默认（multihead 模式需 --force_mh_ft_lr）
EPOCHS           = 1500            # 实际轮数上限：mace 0.3.16 单卡 PATIENCE 只打日志不跳出
                                   # （README §9.2⑥），EPOCHS 就是真实训练轮数，别指望早停截断
PATIENCE         = 100             # 验证损失连续无改善多少代即"早停"（单卡仅记录不跳出；模型取最佳 checkpoint）
USE_SWA          = false           # [FIX-H3] 默认关：PATIENCE 不跳出时 EPOCHS=START_SWA 前的段才训到，
                                   #   SWA 段若跑不到（EPOCHS<START_SWA）则 --swa 是死配置
START_SWA        = 1200            # autoplex SWA 起点（USE_SWA=true 且 EPOCHS>START_SWA 才生效）
LOSS             = huber           # autoplex 同款（含应力项；换 stress/universal 需先确认你的 mace 版本）
HUBER_DELTA      = 0.05            # eV/Å。MACE 默认 0.01 对本数据太小，全程线性段=L1，会推高力 RMSE
VALID_FRACTION   = 0.10
DEVICE           = auto            # auto | cpu | cuda（jzzn 无 GPU 分区，auto 恒落 cpu；
#                                      有卡集群：DEVICE=cuda + CONDA_ENV 指 GPU 环境 + 换 submit_mace 模板）
N_GPU            = 0               # GPU 微调分卡数：0=auto（=N_COMMITTEE，seed s → GPU (s-1)%N_GPU）；
#                                      fakeslurm 会把每个作业钉在 GPU0，靠这个显式均摊到多卡防 OOM

# --- 单点（step5）---
KPOINTS_GRID     =                 # 空 = Γ-only（超胞取力标准做法）；"2 2 2" 显式
EDIFF            = 1e-7            # 单点必须比常规静态更严
NCORE            = 4               # 12 核：KPAR=1、NCORE=4

# --- 环境：集群默认注入（勿写死路径，切集群自动跟随）---
