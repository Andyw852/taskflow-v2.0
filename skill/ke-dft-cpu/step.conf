# =====================================================================
# step.conf —— 步骤参数（本文件在两个地方各有一份，作用不同）
#
#   skill/ke-dft-cpu/templates/step.conf                       出厂默认，别改
#   <材料>/ke-dft-cpu/project_setting/templates/step.conf      本材料共用，改这份
#   <材料>/ke-dft-cpu/project_setting/templates/<步骤名>/step.conf   只管该步骤
#
# 生效顺序（越靠后越优先）：出厂默认 -> 本材料共用 -> 该步骤专属。
# 每层只写跟上一层不一样的键，不用整套抄。
#
# 查看最终生效值和来源：
#     tf -tt ke-dft-cpu -p <材料> -j <步骤> conf
# 直接改（写进"该步骤专属"那一份，skill 库不动）：
#     tf -tt ke-dft-cpu -p <材料> -j <步骤> conf --set params.FUNC=pbe-d3
# =====================================================================

[params]
# 带隙层级：pbe = 只算到 PBE 带隙（跑到 PBE 画图为止，跳过整段 HSE）
#           hse = 继续算 HSE 带隙（默认）。驱动据此增删 HSE 步骤。
BANDGAP = hse
# 结构优化泛函，决定 INCAR 的 GGA / IVDW，并由 step1 写进 workflow_method.txt
# 供 step2/3/4 继承（step4 的 HSE 泛函族也据此自动选 HSE06 / HSEsol）。
#   auto     嗅探 incar_*.tpl 里写死的 GGA/IVDW 反推；模板里是 {{GGA}} 占位符
#            （正常情况）就取脚本默认值 pbesol
#   pbe-d3   PBE + DFT-D3(BJ)  -> GGA=PE, IVDW=12
#   pbesol   PBEsol            -> GGA=PS, 无色散修正
#   pbe      纯 PBE            -> GGA=PE, 无色散修正
FUNC = pbesol
