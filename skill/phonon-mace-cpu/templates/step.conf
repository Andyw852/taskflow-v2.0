# =====================================================================
# phonon-mace-cpu 全局 step.conf —— 模型、精度、环境。
# =====================================================================
[params]
MACE_MODEL     = MACE-matpes-pbe-omat-ft.model
# MACE_MODEL_DIR 由集群默认自动注入：setting/<hpc>.yaml 的 mace_model_dir（换超算自动
# 跟着走）。要单独指定就在这里写，或项目 project_setting/templates/step.conf 覆盖。

DEVICE = cpu
DTYPE  = float64

# CONDA_SH/CONDA_ENV 由集群默认自动注入：setting/<hpc>.yaml 的 conda_sh/conda_env
# （jzzn 是 venv 路径 / 3090 是 conda env 名，换超算自动跟着走）。
# 项目可在 project_setting/templates/step.conf 覆盖。
