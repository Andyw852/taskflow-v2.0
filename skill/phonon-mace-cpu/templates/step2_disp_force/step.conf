# step2_disp_force 参数（超胞 + 随机位移帧数 + 取力）。
[params]
SUPERCELL     =          # 显式 "4 4 4"；空=按 MIN_SC_LEN 自动
MIN_SC_LEN    = 15.0     # 超胞每个非真空方向的最小胞长(Å)
MAX_MULTIPLE  = 6
N_DISP        = auto     # 随机位移帧数：auto=按 ALM 2 阶自由力常数反推（下限 10）
                         # 也可写死整数
OVERSAMPLE    = 3        # N = ceil(nfree_fc2/DOF) × OVERSAMPLE
ALM_CUT2      = 7.0      # ALM 二阶力常数截断半径(Å)，避免搜索整个超胞
DISP_DISTANCE = 0.01     # hiphive MC-rattle 目标位移 RMS(Å)；声子 2 阶用 0.01
MC_DMIN_SCALE = 0.85     # d_min = 最近邻 × 此系数（防止原子靠太近）
MC_NITER      = 10       # MC 迭代数
RANDOM_SEED   = 2025
