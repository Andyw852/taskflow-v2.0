# step4_kappa 参数（BTE 求解）。
[params]
MESH_OVERRIDE =          # 空 = 用 step2 写进 klmace_params 的 MESH
MESH_SCAN     =          # 分号分隔的多套网格做收敛测试，如 "16 16 16; 20 20 20; 24 24 24"
                         # DFT 路线做不起、审稿人又必问的一条，在这条链上几乎白送
T_MIN         = 100
T_MAX         = 800
T_STEP        = 100
ISOTOPE       = true     # 同位素散射（自然丰度）
BTE           = rta      # rta = --br（默认）；lbte = --lbte 直接解，内存 O(N_mode^2)
EXTRA_ARGS    =          # 原样附加给 phono3py-load，如 "--boundary-mfp 1e6"

[submit]
# nodes           = 1
# ntasks_per_node = 48
# time            = 24:00:00
