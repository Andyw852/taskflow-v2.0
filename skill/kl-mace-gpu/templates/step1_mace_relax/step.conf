# step1_mace_relax 参数（MACE 弛豫，登录节点跑）。
# 改：tf -tt klmace -p <材料> -j step1_mace_relax conf --set params.FMAX=1e-5
[params]
DIMENSION    = auto      # auto | 2d | 3d。2D 会锁死真空方向的胞长和相关剪切
RELAX        = true      # false = 不优化只测残余力（你确信结构已在本势极小点时才用）
RELAX_CELL   = true      # 晶格也放开。做定容/加压对比时置 false
FMAX         = 1e-4      # eV/A。机器学习势很便宜，别学 DFT 只收到 1e-2
MAX_STEPS    = 2000
OPTIMIZER    = FIRE      # ase.optimize 里的名字：FIRE / LBFGS / BFGS
FIX_SYMMETRY = true      # 挂 ASE FixSymmetry。关掉的话数值噪声会把空间群降到 P1，
                         # phono3py 对称约化失效，位移数从几十膨胀到上千
SYMPREC      = 1e-4
CELL_POLICY  = primitive # primitive = 先 spglib 取标准原胞；none = 原样用（2D 恒为 none）
RESIDUAL_TOL = 2e-3      # eV/A。残余力超过它就判本步 FAIL —— 这才是声子能不能算的真闸门
