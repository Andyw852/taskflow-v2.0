# =====================================================================
# kl-mace-gpu 全局 step.conf —— 四个步骤共用的键（模型、精度、conda 环境）。
#
# 三层合并，越靠后越优先：
#   skill/kl-mace-gpu/templates/step.conf                            出厂默认，别改
#   <材料>/kl-mace-gpu/project_setting/templates/step.conf           本材料共用
#   <材料>/kl-mace-gpu/project_setting/templates/<步骤名>/step.conf  只管该步骤
#
# 看生效值和来源：  tf -tt kl-mace-gpu -p <材料> -j <步骤> conf
# 改：              tf -tt kl-mace-gpu -p <材料> -j <步骤> conf --set params.KEY=值
#
# 本节的键四个步骤都得认识，只跟某一步有关的写进 templates/<步骤名>/step.conf。
# =====================================================================

[params]
# --- 模型 -------------------------------------------------------------
# 三种写法：
#   1) 文件名     mace-mpa-0-medium.model
#      在 <步骤目录> → <材料目录> → MACE_MODEL_DIR 里依次找。**推荐**：权重固定、
#      结果可复现、计算节点不需要外网。
#   2) 绝对路径   /public/home/wangchao/software/mace_models/xxx.model
#   3) 基座名     mace-mp:medium / mace-mp:large / mace-off:medium
#      走 mace_mp()/mace_off()，**要联网下载**。计算节点一般没外网，第一次务必先在
#      登录节点跑一次 step1 把权重缓存进 ~/.cache/mace。
#
# GPU 版可以考虑上 large：显存够的话推理时间只增加不到一倍，精度是白拿的。
MACE_MODEL     = MACE-matpes-pbe-omat-ft.model
# MACE_MODEL_DIR 由集群默认自动注入：setting/<hpc>.yaml 的 mace_model_dir（换超算自动
# 跟着走）。要单独指定就在这里写，或项目 project_setting/templates/step.conf 覆盖。

# --- 精度与设备 -------------------------------------------------------
# 全局留 auto：S1/S3 在**登录节点**跑，登录节点通常没有卡，写死 cuda 会当场失败。
# 真正要卡的是 S2，它在 templates/step2_disp_force/step.conf 里把 DEVICE 设成 cuda。
DEVICE = auto
# float64 不要改。声子/三阶力常数对力的数值噪声极敏感，float32 的力误差
# （~1e-3 eV/Å）足以在声学支上做出假虚频，看起来像"这个材料不稳定"。
# 注意：消费级卡（RTX/GeForce）的 FP64 吞吐只有 FP32 的 1/32~1/64，这种卡上
# GPU 版未必比 CPU 版快——脚本会在日志里提醒你，先小规模测一次再选版本。
DTYPE  = float64

# --- conda 环境 ---------------------------------------------------------
# CONDA_SH/CONDA_ENV 由集群默认自动注入：setting/<hpc>.yaml 的 conda_sh/conda_env
# （换超算自动跟着走）。项目可在 project_setting/templates/step.conf 覆盖。
