# step2_disp_force 参数（超胞+位移生成，单作业在 GPU 上取全部力）。
[params]
# 这一步是本技能唯一真正吃 GPU 的地方，所以 DEVICE 在这里写死 cuda（全局是 auto，
# 因为 S1/S3 在登录节点跑）。若卡不可用，脚本会**当场退出**而不是悄悄退回 CPU——
# 在 GPU 队列上退回 CPU 会占着卡跑几十倍的时间，等发现时机时已经烧完了。
DEVICE        = cuda

METHOD        = random   # random = hiphive MC-rattle 随机位移（帧数按 ALM nfree 反推，默认）
                         # findiff = 对称有限位移（帧数随原子数爆炸，仅小体系可用）
SUPERCELL     =          # 显式 "4 4 4"；空 = 按 MIN_SC_LEN 自动。2D 真空方向恒 1
FC2_SUPERCELL =          # 二阶专用大超胞（--dim-fc2），如 "6 6 6"。二阶的长程尾巴
                         # 决定声速和低频支；三阶短程收敛快，不必陪着一起大。
                         # **GPU 版最该花钱的地方就是这里**，比盲目加大 fc3 超胞划算
MIN_SC_LEN    = 20.0     # 超胞每个非真空方向的最小胞长(A)
MAX_MULTIPLE  = 8
DISP_DISTANCE = 0.03     # MC-rattle 目标位移 RMS(Å)。虚频可疑时用 0.01 / 0.05 各跑一次看是否敏感
MC_DMIN_SCALE = 0.85     # MC-rattle d_min = 最近邻 × 此系数
MC_NITER      = 10       # MC-rattle 迭代数
RANDOM_SEED   = 2025     # MC-rattle 随机种子
N_RANDOM      = auto     # random 帧数：auto=按 ALM nfree 反推（N=ceil(Σnfree/DOF)*OVERSAMPLE）
                         # 也可写死整数
N_RANDOM_FC2  = auto     # fc2 专用超胞随机帧数（auto=按 ALM 反推，只算二阶）
OVERSAMPLE    = 3        # 随机位移过采样系数
ALM_CUT2      =          # 二阶截断(Å)；空=不截断
ALM_CUT3      = 6.0      # 三阶截断(Å)
KAPPA_MESH    = 24 24 24 # BTE q 网格，写进 klmace_params 供 step4（2D 自动 kz=1）
SUBTRACT_RESIDUAL = true # 扣掉未位移超胞的残余力。不扣会破坏声学求和规则
CKPT          = 50       # 每多少帧落一次断点（GPU 快，落盘可以稀一点）

[submit]
# GPU 队列名按你们集群改。MACE 是单进程，一张卡就够；申请多卡不会更快，
# 本脚本没有做多卡数据并行。
partition       = gpu
gres            = gpu:1
nodes           = 1
ntasks_per_node = 1
# time          = 12:00:00
