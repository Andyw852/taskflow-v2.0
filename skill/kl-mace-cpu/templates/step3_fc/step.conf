# step3_fc 参数（拟合力常数 + 声子谱 + 虚频闸，登录节点）。
[params]
BAND_POINTS = 101
IMAG_THR    = 0.10       # 虚频阈值(THz)：最小频率 < -IMAG_THR 判不稳定，step4 不启动
FIT         = auto       # phono3py 拟合器：auto（findiff->sym-fc，random->symfc）/ symfc / alm
NAC_BORN    =            # 外部 BORN 文件路径。MACE 给不出 Born 电荷和 eps_inf，极性
                         # 材料想要 LO-TO 劈裂只能拿 DFPT 结果来补，例如：
                         # /public/home/wangchao/.../<材料>/kl-dft-cpu/step3_nac/BORN

# --- 拟合软件 -----------------------------------------------------------
# phono3py = 上面 FIT 的 symfc/alm；pheasy = 下面的 PHEASY_METHOD。
# CPU 默认 pheasy+LASSO：10 帧量级的随机位移下 symfc 欠定、κ 明显偏低，
# pheasy LASSO（列标准化+debias）能把 fc 幅值守住、κ 回合理量级。
FIT_SOFTWARE   = pheasy
PHEASY_METHOD  = LASSO     # pheasy 方法：OLS | LASSO | RFE | RFE_TSQR
PHEASY_C3_CUTOFF = 6.0     # pheasy 三阶截断(Å)；None/空=不截断
