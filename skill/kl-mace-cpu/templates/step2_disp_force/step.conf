# step2_disp_force 参数（超胞+位移生成，单作业在 CPU 上取全部力）。
[params]
DEVICE        = cpu

METHOD        = random   # random = hiphive MC-rattle 随机位移（帧数按 ALM nfree 反推）
                         # findiff = 对称有限位移（最干净，但帧数由对称性决定、CPU 上慢）
SUPERCELL     =          # 显式 "3 3 3"；空 = 按 MIN_SC_LEN 自动。2D 真空方向恒 1
FC2_SUPERCELL =          # 二阶专用大超胞（--dim-fc2）。CPU 上这也是性价比最高的
                         # 加钱方式：fc2 的帧数远少于 fc3
MIN_SC_LEN    = 15.0     # 超胞每个非真空方向的最小胞长(A)。比 GPU 版保守一档
MAX_MULTIPLE  = 6
DISP_DISTANCE = 0.03     # MC-rattle 目标位移 RMS(Å)；三阶用 0.03
MC_DMIN_SCALE = 0.85     # MC-rattle d_min = 最近邻 × 此系数
MC_NITER      = 10       # MC-rattle 迭代数
RANDOM_SEED   = 2025     # MC-rattle 随机种子
N_RANDOM      = auto     # random 帧数：auto=按 ALM nfree 反推（N=ceil(Σnfree/DOF)*OVERSAMPLE）
                         # 也可写死整数，如 120
N_RANDOM_FC2  = auto     # fc2 专用超胞随机帧数（auto=按 ALM 反推，只算二阶）
OVERSAMPLE    = 3        # 随机位移过采样系数（越大越准越慢）
ALM_CUT2      =          # 二阶截断(Å)；空=不截断
ALM_CUT3      = 6.0      # 三阶截断(Å)
KAPPA_MESH    = 80 80 1 # BTE q 网格（S4 在 CPU 上跑，两版一样，这里保守一档）
SUBTRACT_RESIDUAL = true # 扣掉未位移超胞的残余力。不扣会破坏声学求和规则
CKPT          = 10       # 每多少帧落一次断点。CPU 单帧慢，落密一点，被墙钟砍了少赔

[submit]
# MACE 是**单进程多线程**（torch），不是 MPI。ntasks 开满只会起 N 份互相抢核的
# 独立进程，把同一件事算 N 遍。核数走 cpus-per-task。
nodes           = 1
ntasks_per_node = 1
# time          = 48:00:00
