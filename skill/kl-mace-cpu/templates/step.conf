# =====================================================================
# kl-mace-cpu 全局 step.conf —— 四个步骤共用的键（模型、精度、conda 环境）。
#
# 三层合并，越靠后越优先：
#   skill/kl-mace-cpu/templates/step.conf                            出厂默认，别改
#   <材料>/kl-mace-cpu/project_setting/templates/step.conf           本材料共用
#   <材料>/kl-mace-cpu/project_setting/templates/<步骤名>/step.conf  只管该步骤
#
# 看生效值和来源：  tf -tt kl-mace-cpu -p <材料> -j <步骤> conf
# 改：              tf -tt kl-mace-cpu -p <材料> -j <步骤> conf --set params.KEY=值
# =====================================================================

[params]
# --- 模型 -------------------------------------------------------------
# 三种写法：
#   1) 文件名     mace-mpa-0-medium.model
#      在 <步骤目录> → <材料目录> → MACE_MODEL_DIR 里依次找。**推荐**。
#   2) 绝对路径   /public/home/wangchao/software/mace_models/xxx.model
#   3) 基座名     mace-mp:small / mace-mp:medium
#      走 mace_mp()，**要联网下载**；第一次先在登录节点跑一次 step1 缓存权重。
#
# CPU 版建议先用 medium 摸清单帧耗时（step2 日志里有"帧/s"和 ETA）。
# 慢到不可接受时，small 大约快 2~3 倍，但势的质量下降，虚频判断更不可信——
# 那种情况下更该做的是缩小超胞或改 METHOD=random，而不是换小模型。
MACE_MODEL     = MACE-matpes-pbe-omat-ft.model
# MACE_MODEL_DIR 由集群默认自动注入：setting/<hpc>.yaml 的 mace_model_dir（换超算自动
# 跟着走）。要单独指定就在这里写，或项目 project_setting/templates/step.conf 覆盖。

# --- 精度与设备 -------------------------------------------------------
DEVICE = cpu
# float64 不要改。float32 的力误差（~1e-3 eV/Å）足以在声学支上做出假虚频。
# CPU 上 FP64 和 FP32 的差距远没有 GPU 那么夸张，省这一点毫无必要。
DTYPE  = float64

# --- conda 环境 ---------------------------------------------------------
# CONDA_SH/CONDA_ENV 由集群默认自动注入：setting/<hpc>.yaml 的 conda_sh/conda_env
# （jzzn 是 venv 路径 / 3090 是 conda env 名，换超算自动跟着走）。
# 项目可在 project_setting/templates/step.conf 覆盖。
