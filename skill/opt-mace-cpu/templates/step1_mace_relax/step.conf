# step1_mace_relax 参数（MACE 弛豫；submit 模式，跑计算节点作业）。
[params]
DIMENSION    = auto      # auto | 2d | 3d
RELAX        = true
RELAX_CELL   = true
FMAX         = 1e-3      # eV/A。结构优化+形成能 1e-3 足够（能量已收敛到 ~1e-5 eV）；
                          # 大体系（C60/C120）用 1e-4 会拖到几小时，没必要
MAX_STEPS    = 2000
OPTIMIZER    = FIRE
FIX_SYMMETRY = true
SYMPREC      = 1e-4
CELL_POLICY  = primitive
RESIDUAL_TOL = 2e-3      # eV/A
STRESS_TOL   = 0.05      # GPa。晶胞残余应力闸（RELAX_CELL=true 才有意义）；
                          # <=0 关闭。2D 只判面内分量
