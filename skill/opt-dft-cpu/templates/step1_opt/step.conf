# =====================================================================
# step.conf —— opt-dft-cpu step1_opt（结构弛豫）出厂默认
#
# 分层合并，越靠后越优先：
#   skill/opt-dft-cpu/templates/step1_opt/step.conf        出厂默认（本文件）
#   <材料>/opt-dft-cpu/project_setting/templates/step.conf  本材料共用
#   <材料>/opt-dft-cpu/project_setting/templates/step1_opt/step.conf  只管本步
#
# 看生效值：  tf -tt opt-dft-cpu -p <材料> -j 1 conf
# 改参数：    tf -tt opt-dft-cpu -p <材料> -j 1 conf --set params.KEY=值
# =====================================================================

[params]
# 结构优化泛函，决定 INCAR 的 GGA / IVDW，并写进 workflow_method.txt 供 S2 继承。
#   pbe-d3   PBE + DFT-D3(BJ)  -> GGA=PE, IVDW=12
#   pbesol   PBEsol            -> GGA=PS, 无色散修正
#   pbe      纯 PBE            -> GGA=PE, 无色散修正
FUNC = pbesol
