# =====================================================================
# step.conf —— opt-dft-cpu step3_energy（能量后处理）出厂默认
#
# 分层合并，越靠后越优先：
#   skill/opt-dft-cpu/templates/step3_energy/step.conf       出厂默认（本文件）
#   <材料>/opt-dft-cpu/project_setting/templates/step.conf   本材料共用
#   <材料>/opt-dft-cpu/project_setting/templates/step3_energy/step.conf  只管本步
#
# 看生效值：  tf -tt opt-dft-cpu -p <材料> -j 3 conf
# 改参数：    tf -tt opt-dft-cpu -p <材料> -j 3 conf --set params.KEY=值
#
# ★ 参考能量只整体平移排名，不影响同一组成下的相对次序；E_per_atom 无需任何参考值。
#   参考值必须用与 S1/S2 完全相同的泛函/赝势/ENCUT 单独算参考结构得到，否则不可比。
# =====================================================================

[params]
# 算哪些能量
CALC_FORMATION = true
CALC_INTERCALATION = true

# ---- 形成能 E_form = E_tot - Σ n_i·μ_i ----
# 元素化学势 μ（eV/原子，相对元素基态参考，如石墨 C、bcc Li）。不填则跳过形成能。
#   例： MU = C:-9.0 Li:-1.9
# MU =

# ---- 嵌入能 E_embed = E_tot - E_host - n_g·μ_g ----
# 客体元素（如 Li）、客体化学势 μ_g(eV/原子)，加“宿主”二选一。
# 宿主两种指定方式都会做骨架一致性校验（当前结构去掉全部客体后须与宿主逐元素相等，
# 否则直接报错终止）；本步算的是相对“空宿主”(x 从 0)的平均嵌入能，宿主里不应含客体。
#
#   GUEST_ELEMENT = Li
#   MU_GUEST = -1.9
#
#   方式 A（推荐）：指到宿主参考材料目录，自动读 E_host + 骨架组分（并软比对泛函）
#     HOST_DIR = ../C60_host          # 相对本材料目录，或绝对路径；指材料目录或其 step2_static
#
#   方式 B：手填宿主总能 + 声明骨架组分做校验
#     HOST_ENERGY = -1400.0
#     HOST_FORMULA = C:60             # 不写则不校验骨架（老行为，仅在 note 里标注“未校验”）
#
# GUEST_ELEMENT =
# MU_GUEST =
# HOST_DIR =
# HOST_ENERGY =
# HOST_FORMULA =