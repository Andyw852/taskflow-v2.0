# step6_kappa 参数（BTE 求解晶格热导率，计算节点）。
# 只放本步 gen_step6_kappa.py 认识的键；FUNC 由全局 step.conf 带入，这里不重复。
[params]
# 热导率计算软件：phono3py（默认）| shengbte
#   两者都从 S5_fc 取力常数：phono3py 读 step5_fc/phono3py/，shengbte 读 step5_fc/shengbte/
#   （后者需 S5 的 EXPORT_SHENGBTE=true）。
SOLVER = phono3py

# phono3py 的 BTE 解法：rta(--br，弛豫时间近似，便宜) | lbte(--lbte，直接解，更准更贵)
BTE_METHOD = rta

# BTE q 网格覆盖。留空 = 用 step4 写进 kl_params.txt 的 KAPPA_MESH（2D 真空方向已压 1）。
# MESH_OVERRIDE =

# 温度扫描 (K)
T_MIN  = 100
T_MAX  = 800
T_STEP = 100

# 同位素散射（phono3py --isotope / ShengBTE autoisotopes）
ISOTOPE = True

# shengbte 展宽系数（仅 shengbte 用）
SCALEBROAD = 0.1
# ShengBTE 可执行文件（按集群填绝对路径）
# SHENGBTE_EXE = /public/home/wangchao/software/sousaw-shengbte-aocl/ShengBTE

# 2D 厚度归一化：phono3py 用含真空的原胞体积做分母，面内 kappa 被 Lz 稀释，需乘 Lz/d。
#   vdw = 原子 z 跨度 + 两侧 vdW 半径 | cell = 用 Lz（不归一）| 数值 = 固定 A
KAPPA_2D_THICKNESS = vdw

# 2D 的 NAC：auto = 2D 默认不用 3D-NAC（LO-TO 在严格 2D 应趋零）；on = 强制用；off = 强制不用
KAPPA_NAC = auto