# =====================================================================
# @kl-dft-cpu-stepconf-layout: slim-global-v1
# step.conf —— kl-dft-cpu（晶格热导率）全局参数
#
# 这份是"出厂默认·全局层"，只放各步骤【共用】的键（当前只有 FUNC）。
# 每个步骤自己的参数放各自 per-step 文件，别往这份里塞（塞了会漏进别的步骤，
# 触发"本脚本不认识的键"）：
#   templates/step2_static/step.conf   静态自洽
#   templates/step3_nac/step.conf      NAC 介电
#   templates/step4_disp/step.conf     超胞+位移（METHOD/超胞/网格…）
#   templates/step5_fc/step.conf       力常数拟合（FIT_ENGINE/pheasy…）
#   templates/step6_kappa/step.conf    BTE 求解（SOLVER/温度/BTE_METHOD…）
#
# 三层合并，越靠后越优先：
#   skill/kl-dft-cpu/templates/step.conf                            出厂默认（本文件）
#   <材料>/kl-dft-cpu/project_setting/templates/step.conf           本材料共用
#   <材料>/kl-dft-cpu/project_setting/templates/<步骤名>/step.conf  只管该步骤
#
# 看生效值和来源：  tf -tt kl-dft-cpu -p <材料> -j <步骤> conf
# 改某步参数：      tf -tt kl-dft-cpu -p <材料> -j <步骤> conf --set params.KEY=值
# =====================================================================

[params]
# 结构优化泛函，决定 INCAR 的 GGA / IVDW，并由 step1 写进 workflow_method.txt
# 供后续步骤继承（取力步 step4 也用同一个值，保证弛豫与取力泛函一致）。
#   pbe-d3   PBE + DFT-D3(BJ)  -> GGA=PE, IVDW=12
#   pbesol   PBEsol            -> GGA=PS, 无色散修正
#   pbe      纯 PBE            -> GGA=PE, 无色散修正
FUNC = pbesol