# =============================================================================
# skill/kl-dft-cpu/skill.yaml —— 晶格热导率（有限位移/随机位移 + BTE），schema 1
#
# 物理链（对齐 lattice_kappa.py 参考引擎，拆成 tf 异步分步）：
#   S1_opt      结构优化（复用 band-dft-cpu/elastic-dft-cpu/ke-dft-cpu 同一 gen_step1_std_opt.py，一字不差）
#   S2_static   原胞静态自洽：出带隙判金属、作声子参考胞
#   S3_nac      NAC 介电/Born（LEPSILON DFPT）→ BORN 文件；金属/关 NAC 自动跳过（可选步）
#   S4_disp     超胞 + 位移生成，扇出：
#                 method=findiff → phono3py 对称有限位移（不需 ALM）
#                 method=alm     → 随机位移，位移数由 ALM 自由力常数个数 × oversample 决定
#               每个位移一个 disp-* 子目录，各自单点取力
#   S5_fc       提交计算节点：收力 → 拟合 fc2/fc3 → 双格式导出 → 虚频做闸（FAIL 则 S6 不启动）
#               拟合器 FIT_ENGINE=phono3py(symfc/alm，默认) | pheasy(随机位移压缩感知，需 alm)
#               产出 step5_fc/phono3py/（fc2/fc3.hdf5）与 step5_fc/shengbte/（FORCE_CONSTANTS_2ND/3RD）
#   S6_kappa    提交计算节点跑 BTE：SOLVER=phono3py(rta/lbte) | shengbte → 晶格热导率
#
# 参数全部走 step.conf（stepconf.py 解析，三层合并：技能默认 → 技能本步默认 →
# 项目共用 → 项目本步）。改参数：tf -tt kl-dft-cpu -p <材料> -j <步骤> conf --set params.KEY=值
# 模板 per_step：templates/<步骤名>/{incar_*,submit_*}.tpl，缺则回落 templates/ 根。
# 2D 全程把真空方向压 1（超胞倍数、K 网格、BTE 网格）。
# =============================================================================
schema: 2
name: kl-dft-cpu
desc: 晶格热导率(DFT/CPU)
version: "0.2"
checks: ../_common/checks_relax.py   # 公共池里的私有判据（relax_injob）

template_layout: per_step
template_dir: templates

defaults:
  hpc: jzzn
  skill_subdir: true

# 各步关键输入/输出拉回本地；扇出 S4 只拉汇总，S5/S6 用 fetch_all 整目录拉回。
fetch_files: [POSCAR, CONTCAR, INCAR, KPOINTS, POTCAR, submit.sh, OUTCAR,
              vasprun.xml, workflow_method.txt, kl_params.txt, BORN, provenance.json,
              phono3py_disp.yaml, fc2.hdf5, fc3.hdf5, band-dft-cpu.yaml,
              phonon_summary.json, kappa_summary.json,
              phono3py_kappa.log, queue.out, queue.err]

steps:
  - {seq: 1, name: step1_std_opt, label: S1_opt, check: relax_injob,
     gen: gen_step1_std_opt.py, contcar_to_poscar: true,
     gen_need: [relax_common.py, method_select.py, mol_common.py, incar_0d.tpl, submit_std_0d.tpl, dim_common.py, stepconf.py, step.conf,
                check_common.py, step1_check_and_resubmit.py,
                incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl]}

  - {seq: 2, name: step2_static, label: S2_static, check: outcar,
     gen: gen_step2_static.py,
     # provenance_common.py（v1.0）：公共池的 provenance 补写器，gen 脚本可选调用
     gen_need: [dim_common.py, stepconf.py, step.conf, kl_common.py,
                check_common.py, step2_check_and_resubmit.py, provenance_common.py,
                incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl]}

  - {seq: 4, name: step4_disp, label: S4_disp, check: outcar, fanout: "disp-*",
     gen: gen_step4_disp.py,
     gen_need: [dim_common.py, stepconf.py, step.conf, kl_common.py, lattice_kappa.py,
                check_common.py, step2_check_and_resubmit.py,
                incar_force_2d.tpl, incar_force_3d.tpl,
                submit_std_2d.tpl, submit_std_3d.tpl]}

  # S5_fc 现为【提交计算节点】作业（去掉 run: gen）：gen 只写 submit.sh + fit_config.json，
  #   拟合/导出/虚频闸在作业里由 kl_fc_backends.py 执行。marker 仍是 phonon_summary.json。
  - {seq: 5, name: step5_fc, label: S5_fc, check: phonon,
     gen: gen_step5_fc.py, fetch_all: true,
     gen_need: [dim_common.py, stepconf.py, step.conf, kl_common.py, lattice_kappa.py,
                kl_fc_backends.py, submit_fit_p3py.tpl, submit_fit_pheasy.tpl]}

  - {seq: 6, name: step6_kappa, needs: [step5_fc], label: S6_kappa, check: marker,
     marker: 'kappa_summary.json:"KAPPA_DONE": true',
     gen: gen_step6_kappa.py, fetch_all: true,
     gen_need: [dim_common.py, stepconf.py, step.conf, kl_common.py, lattice_kappa.py,
                submit_p3py.tpl, submit_shengbte.tpl, submit_fourphonon.tpl, vdw_radii.py]}

# NAC 为可选步组：极性绝缘体默认开（LO-TO 劈裂需要）。
#   关闭：项目配置写 nac: false —— tf 直接不注入 step3_nac，S5/S6 因无 BORN 自然无 NAC。
#   金属：step2 判金属后会打印提示，请手动置 nac: false（金属无 LO-TO 劈裂，DFPT 介电发散）。
optional_steps:
  nac:
    default: true
    steps:
      - {seq: 3, name: step3_nac, label: S3_nac, after: step2_static,
         check: marker, marker: "OUTCAR:MACROSCOPIC STATIC DIELECTRIC TENSOR",
         gen: gen_step3_nac.py,
         gen_need: [dim_common.py, stepconf.py, step.conf, kl_common.py,
                    check_common.py, step2_check_and_resubmit.py,
                    incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl]}

  # S5.1 声子谱绘图（登录节点 run: gen，不提交作业）：读 step5_fc/phono3py/fc2.hdf5 画谱。
  #   有 BORN → band_nac.* + band_nonac.* 两张；无 BORN → 只 band_nonac.*。
  phonon_plot:
    default: true
    steps:
      - {seq: 5.1, name: step5_phonon_plot, label: S5.1_plot, after: step5_fc,
         gen: "gen_step5.1_plot_phonon.py", check: plot, run: gen, gen_need: [],
         done_marker: phonon_plot_summary.json, fetch_all: true}

requires:
  python: [phonopy, phono3py, numpy, spglib]
  conda: atomate2_p_a
  exe: [vasp_std, vaspkit, phono3py]
# =============================================================================
# 自描述（schema 2，v1.0）—— io_schema / flow / corrections
#   只给人和工具看（论文图 2 的技能卡片、tf schema 校验），**不参与运行期装配**：
#   写错只会让 tf schema 报错，不影响任何计算行为。
#   渲染： tf skill show kl-dft-cpu        机器可读： tf skill show kl-dft-cpu --json
# =============================================================================
io_schema:
  inputs:
    - {name: POSCAR, from: user, required: true,
       desc: "原胞初始结构（材料目录根）。胞由本技能 S1_opt 自己弛豫，不需要预优化"}
  outputs:
    - {name: kappa_summary.json, step: S6_kappa, type: json,
       desc: "最终产物：κL(T) 及各向异性/收敛信息"}
    - {name: fc2.hdf5, step: S5_fc, type: hdf5, desc: "二阶力常数（声子谱与 BTE 都要）"}
    - {name: fc3.hdf5, step: S5_fc, type: hdf5, desc: "三阶力常数（BTE 本征散射）"}
    - {name: BORN, step: S3_nac, type: text,
       desc: "介电张量 + Born 有效电荷（LO-TO 劈裂）；关掉 nac 步组时没有这个产物"}
  params:
    - {name: METHOD, values: [alm, findiff], default: alm, where: step.conf,
       desc: "位移生成方式：alm = 随机位移+压缩感知（帧数少）；findiff = phono3py 对称有限位移"}
    - {name: FIT_ENGINE, values: [phono3py, pheasy], default: phono3py, where: step.conf,
       desc: "力常数拟合引擎；pheasy 需要 METHOD=alm（随机位移压缩感知）"}
    - {name: FC_CALC, values: [symfc, alm], default: symfc, where: step.conf,
       desc: "phono3py 的拟合后端：symfc（对称性约束）或 alm"}
    - {name: SOLVER, values: [phono3py, shengbte], default: phono3py, where: step.conf,
       desc: "BTE 求解器（shengbte 走 FORCE_CONSTANTS_2ND/3RD 双格式导出）"}
    - {name: BTE_METHOD, values: [rta, lbte], default: rta, where: step.conf,
       desc: "单模弛豫时间近似（快）或直接解线性化 BTE（准，内存 O(N_mode^2)）"}
    - {name: KAPPA_MESH, default: "15 15 15", where: step.conf,
       desc: "BTE q 网格（2D 自动把真空方向压 1）"}
    - {name: IMAG_THR, default: 0.10, where: step.conf,
       desc: "虚频闸（THz）：最小频率低于 -IMAG_THR 判结构不稳定，S6_kappa 不启动"}
    - {name: MAX_DISP, default: 500, where: step.conf,
       desc: "位移帧数硬闸：超过就报错停步（防超胞设太大白烧机时）"}
    - {name: OVERSAMPLE, default: 3, where: step.conf,
       desc: "随机位移过采样系数（帧数 = ALM 自由力常数个数 × 它）"}
  steps:
    - {step: S1_opt, title: "Relax structure",
       tool: "VASP (vasp_std) · relax_common 三段式",
       inputs: [POSCAR], outputs: [CONTCAR],
       validator: "力/能量收敛（relax_injob：逐段判 reached required accuracy）",
       note: "与 band/elastic/ke/opt 系列共用同一份弛豫策略，保证跨技能可比"}
    - {step: S2_static, title: "Static SCF (reference cell)",
       tool: "VASP (vasp_std)", inputs: [CONTCAR], outputs: [OUTCAR, vasprun.xml],
       validator: "OUTCAR 自洽完成（check: outcar）",
       note: "顺带判金属/带隙；金属建议关掉 nac 步组（DFPT 介电在金属上发散）"}
    - {step: S3_nac, title: "NAC / DFPT dielectric",
       tool: "VASP (LEPSILON DFPT)", inputs: [CONTCAR], outputs: [BORN, OUTCAR],
       validator: "OUTCAR 含 MACROSCOPIC STATIC DIELECTRIC TENSOR",
       note: "可选步组 nac（默认开）；无极性/金属体系在项目配置写 nac 关闭"}
    - {step: S4_disp, title: "Generate forces",
       tool: "VASP (vasp_std 超胞单点) · phono3py 位移 / ALM MC-rattle",
       inputs: [CONTCAR], outputs: ["disp-* 力数据集", phono3py_disp.yaml],
       validator: "扇出判据：每个 disp-* 子目录的 OUTCAR 全部完成（表格显示 3/5 这样的进度）",
       note: "method=findiff 走对称有限位移；alm 走随机位移，帧数由自由力常数个数 × OVERSAMPLE 定"}
    - {step: S5_fc, title: "Fit force constants",
       tool: "phono3py symfc / ALM · Pheasy (CPU)",
       inputs: ["disp-* 力数据集"], outputs: [fc2.hdf5, fc3.hdf5, phonon_summary.json],
       validator: "声子判据（虚频闸 IMAG_THR）+ phonon_summary.json marker",
       note: "在计算节点作业里做：收力 → 拟合 → 双格式导出 → 虚频闸；FAIL 则 S6 不启动"}
    - {step: S5.1_plot, title: "Phonon band plot",
       tool: "phonopy / phono3py（登录节点跑，不排队）",
       inputs: [fc2.hdf5, BORN], outputs: [phonon_band.png, phonon_plot_summary.json],
       validator: "run: gen 步：产物 phonon_plot_summary.json 存在即完成"}
    - {step: S6_kappa, title: "Solve transport (BTE)",
       tool: "phono3py RTA/LBTE · ShengBTE",
       inputs: [fc2.hdf5, fc3.hdf5, BORN], outputs: [kappa_summary.json, "kappa-m*.hdf5"],
       validator: "kappa_summary.json 里 KAPPA_DONE 为 true"}

flow:
  title: "Lattice thermal conductivity"
  backend: "VASP / Pheasy / Phono3py / ShengBTE"
  summary: "弛豫胞 → 静态自洽（判金属）→ [NAC 介电/Born] → 超胞位移取力 → 拟合 fc2/fc3（虚频闸）→ BTE 解 κL(T)"
  stages:
    - {name: "弛豫", steps: [S1_opt], produces: [CONTCAR],
       desc: "结构优化到力收敛；后续每一步都用这个胞"}
    - {name: "参考态", steps: [S2_static, S3_nac], produces: [OUTCAR, BORN],
       desc: "静态自洽给可比总能并判金属；NAC 步给介电张量与 Born 电荷"}
    - {name: "力数据集", steps: [S4_disp], produces: ["disp-* 力数据集"],
       desc: "建超胞、按 METHOD 生成位移，每帧一个 disp-* 子目录并行单点取力（扇出步）"}
    - {name: "力常数", steps: [S5_fc], produces: [fc2.hdf5, fc3.hdf5],
       desc: "拟合二阶/三阶力常数并导出 phono3py + ShengBTE 两种格式；虚频超阈判不稳定"}
    - {name: "输运", steps: [S6_kappa], produces: [kappa_summary.json], desc: "BTE 求 κL(T)"}
    - {name: "出图", steps: [S5.1_plot], produces: [phonon_band.png],
       desc: "声子谱绘图（登录节点，秒级）"}
  next_skills:
    - {skill: te-screen, via: kappa_summary.json,
       desc: "κL 与电输运一起进 zT 热电筛选"}
  requires:
    POSCAR: "材料目录根必须有 POSCAR"
    exe: "phono3py / vasp_std / vaspkit（见文件末尾的 requires: 段）"

# 本技能实际会遇到、且 skill/_common/_corrections/ 里已有对策的失败类型
corrections: [zbrent, nsw_continue, node_fail, dir_missing]
