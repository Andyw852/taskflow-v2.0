# step3_formation 参数（形成能参考化学势）。
# MU = 元素:能量(eV/原子)，各元素都要有；参考态用同一套设置单独算（如金刚石 Si、
# 石墨 C、bcc Li 的每原子总能）。不填则 E_per_atom 照常输出、形成能标"未算"。
[params]
MU = Si:-5.386
# MU_MODEL：算上面这些 μ 时用的 MACE 模型（照抄全局的 MACE_MODEL 即可）。
# MACE 总能带模型自己的能量零点 —— E_tot 换了模型而 μ 没换，数字照样
# 正常输出，排名却是错的。写了它 step3 会自动比对，不一致直接报错。
# 不写不影响出数，只会打一条 WARN。
MU_MODEL = MACE-matpes-pbe-omat-ft.model
